<title>Туыс-Туған</title>

*{box-sizing:border-box;margin:0;padding:0} body{font-family:'Segoe UI',sans-serif;background:#FBEFD2;color:#3E2A12;overflow-x:hidden}
.hide{display:none!important}
/* ===== ЖЫЛЫ ДИЗАЙН - ТУЫС-ТУҒАН ===== */
input{width:100%;padding:14px;border:1.5px solid #E8D5A8;border-radius:14px;margin-bottom:10px;font-size:16px;color:#3E2A12;background:#FFFBF0}
input:focus{outline:none;border-color:#C98A1B}
.login{background:#FBEFD2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.login::before{content:'✦ ❁ ✦ ❁ ✦';position:absolute;top:10px;left:0;right:0;text-align:center;color:#E8D5A8;font-size:20px;letter-spacing:12px}
.login::after{content:'❁ ✦ ❁ ✦ ❁';position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#E8D5A8;font-size:20px;letter-spacing:12px}
.login-box{width:100%;max-width:360px;text-align:center;position:relative;z-index:2}
.logo-circle{width:110px;height:110px;margin:0 auto 8px;background:linear-gradient(135deg,#FFD700,#C98A1B);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;border:4px solid #fff;box-shadow:0 6px 20px rgba(201,138,27,.35)}
.logo-title{font-size:34px;font-weight:900;color:#8B5A00;letter-spacing:-0.5px}
.logo-sub{font-size:13px;color:#A67C2E;margin-bottom:14px}
.login-card{background:#FFFBF0;border-radius:22px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.08);border:1px solid #F0DFA8}
.feed{height:calc(100vh - 68px);overflow-y:scroll;scroll-snap-type:y mandatory;background:#FBEFD2}
.feed::-webkit-scrollbar{display:none}
.video-card{height:calc(100vh - 68px);width:100%;max-width:430px;margin:0 auto;position:relative;scroll-snap-align:start;background:#000;overflow:hidden;border-radius:0}
.video-card > video,.video-card > img{width:100%;height:100%;object-fit:cover;display:block}
.video-overlay{position:absolute;bottom:0;left:0;right:0;padding:0 78px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none;z-index:3;color:#fff}
.side{position:absolute;right:10px;bottom:118px;display:flex;flex-direction:column;gap:12px;align-items:center;z-index:5}
.side-btn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.side-btn.liked{background:#C98A1B!important}
.side-btn.saved{background:#FFD700!important;border:2px solid #fff}
.side-avatar{width:50px!important;height:50px!important;min-width:50px;border-radius:50%!important;border:3px solid #FFD700;object-fit:cover;display:block;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.side-plus{width:22px;height:22px;background:#C98A1B;border-radius:50%;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:-16px;border:2px solid #fff;cursor:pointer}
.side-count{font-size:11px;margin-top:-8px;font-weight:bold;text-shadow:0 1px 4px #000;color:#fff}
.play-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:70px;pointer-events:none;text-shadow:0 0 20px #000;z-index:4}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:68px;background:#FFFBF0;display:flex;justify-content:space-around;align-items:center;z-index:100;border-top:1px solid #F0DFA8;box-shadow:0 -2px 16px rgba(0,0,0,.06);border-radius:18px 18px 0 0}
.nav button{background:none;border:none;color:#B8A07A;font-size:14px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
