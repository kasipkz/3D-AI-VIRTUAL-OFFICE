<!DOCTYPE html>
<html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Туыс-Туған</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#FFF8F0;color:#222;max-width:480px;margin:auto;min-height:100vh;padding-bottom:70px}
header{background:#FF6B35;color:#fff;padding:14px;text-align:center;font-weight:900;font-size:22px;position:sticky;top:0;z-index:10}
.page{display:none;padding:12px}.page.active{display:block}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0001;margin-bottom:14px}
.card img,.card video{width:100%;display:block;max-height:380px;object-fit:cover}
.card-body{padding:10px}.actions{display:flex;gap:16px;font-size:22px}.actions span{cursor:pointer}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:12px;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#FF6B35;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
button.secondary{background:#FFE8DD;color:#FF6B35}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;border-top:1px solid #eee;padding:10px 0;z-index:20}
nav span{font-size:24px;cursor:pointer;text-align:center}nav span.active{transform:scale(1.2)}
.chat{border:1px solid #eee;padding:10px;border-radius:12px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:#FF6B35;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.badge{background:red;color:#fff;border-radius:50%;padding:2px 7px;font-size:12px;margin-left:auto}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.grid img{width:100%;height:110px;object-fit:cover;border-radius:8px}
.tag{display:inline-block;background:#FFE8DD;padding:6px 10px;border-radius:20px;margin:3px;cursor:pointer}
</style></head><body>
<header>🏠 Туыс-Туған</header>

<!-- КІРУ -->
<div id="p-login" class="page active">
<h2>Қош келдіңіз! 👋</h2><p>Отбасыңның жанында бол</p>
<input id="gmail" placeholder="Gmail поштаңды жаз: aaa@gmail.com">
<input id="nameInput" placeholder="Аты-жөнің">
<button onclick="login()">📧 Gmail арқылы кіру</button><br><br>
<button class="secondary" onclick="login()">📱 Телефон арқылы кіру</button>
<p style="font-size:13px;color:#888">Кіргісі келген адам тіркеліп кіре береді</p>
</div>

<!-- ЛЕНТА -->
<div id="p-home" class="page"><div id="feed"></div></div>

<!-- ІЗДЕУ -->
<div id="p-search" class="page">
<input id="searchInput" placeholder="🔍 Іздеу: отбасы, дәстүр..." oninput="doSearch()">
<div><span class="tag" onclick="setSearch('отбасы')">#отбасы</span><span class="tag" onclick="setSearch('бауырсақ')">#бауырсақ</span><span class="tag" onclick="setSearch('ата-әже')">#ата-әже</span></div>
<div id="searchResult"></div>
</div>

<!-- ЖҮКТЕУ -->
<div id="p-upload" class="page">
<h3>Жаңа жазба 📸</h3>
<select id="upType"><option>Видео 🎬</option><option>Фото 📷</option></select>
<input type="file" id="upFile" accept="image/*,video/*">
<input id="upText" placeholder="Сипаттама жаз...">
<button onclick="publish()">Жариялау ✅</button><p id="upMsg"></p>
</div>

<!-- ХАБАР -->
<div id="p-chat" class="page">
<h3>Хабарлама 💬</h3><div id="chatList"></div><div id="chatBox" style="display:none">
<h4 id="chatName"></h4><div id="msgs" style="min-height:120px;background:#FFF3EC;padding:10px;border-radius:12px"></div>
<input id="msgInput" placeholder="Хабарлама жаз..."><button onclick="sendMsg()">Жіберу ➤</button><br><br><button class="secondary" onclick="backChats()">← Артқа</button></div>
</div>

<!-- ПРОФИЛЬ -->
<div id="p-profile" class="page">
<div style="text-align:center"><div class="avatar" style="width:80px;height:80px;margin:auto;font-size:36px" id="myAvatar">👤</div>
<h3 id="myName">Қонақ</h3><p id="myGmail"></p><p>👥 Туыстар: <b id="followCount">24</b> | ❤️ <b id="likeTotal">128</b></p>
<button class="secondary" onclick="editProfile()">Профиль өңдеу ✏️</button></div>
<h4>Менің жазбаларым</h4><div class="grid" id="myGrid"></div>
</div>

<nav id="bottomNav" style="display:none">
<span onclick="show('home')" id="n-home">🏠</span><span onclick="show('search')" id="n-search">🔍</span>
<span onclick="show('upload')" id="n-upload" style="background:#FF6B35;color:#fff;border-radius:50%;padding:6px 12px">＋</span>
<span onclick="show('chat')" id="n-chat">💬</span><span onclick="show('profile')" id="n-profile">👤</span>
</nav>

<script>
let posts=[
{user:"Анашым ❤️",text:"Бүгін бауырсақ пісірдім #отбасы #бауырсақ",img:"https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800",likes:24,liked:false},
{user:"Ағажан",text:"Ата-әжемізбен кездесу #ата-әже #отбасы",img:"https://images.unsplash.com/photo-1511895426328-dc8714191300?w=800",likes:18,liked:false},
{user:"Сіңілім",text:"Дастархан дайын! #отбасы",img:"https://images.unsplash.com/photo-1543352634-a1c51d9f1fa7?w=800",likes:32,liked:false}
];
let chats=[{name:"Анашым ❤️",last:"Бауырсақ дайын 😋",unread:2,msgs:["Балам, қашан келесің?","Бауырсақ дайын 😋"]},
{name:"Отбасы тобы 👨‍👩‍👧‍👦",last:"Жексенбі жиналамыз ба?",unread:5,msgs:["Жексенбі жиналамыз ба?","Иә!"]},
{name:"Ағажан",last:"Ертең келем",unread:0,msgs:["Ертең келем"]}];
let currentChat=0, myName="Қонақ", myGmail="";
function login(){myName=document.getElementById('nameInput').value||"Қонақ";myGmail=document.getElementById('gmail').value||"guest@gmail.com";
document.getElementById('myName').innerText=myName;document.getElementById('myGmail').innerText=myGmail;
document.getElementById('myAvatar').innerText=myName[0];alert("Қош келдіңіз, "+myName+"! 🎉");
document.getElementById('bottomNav').style.display='flex';show('home');}
function show(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');
document.querySelectorAll('nav span').forEach(e=>e.classList.remove('active'));let n=document.getElementById('n-'+p);if(n)n.classList.add('active');render();}
function render(){let f=document.getElementById('feed');f.innerHTML=posts.map((p,i)=>`<div class="card"><img src="${p.img}"><div class="card-body"><b>${p.user}</b><p>${p.text}</p><div class="actions"><span onclick="like(${i},this)">${p.liked?'❤️':'🤍'} ${p.likes}</span><span onclick="comment(${i})">💬</span><span onclick="share(${i})">↗️ Бөлісу</span><span onclick="savePost(${i})">🔖</span></div></div></div>`).join('');
document.getElementById('chatList').innerHTML=chats.map((c,i)=>`<div class="chat" onclick="openChat(${i})"><div class="avatar">${c.name[0]}</div><div><b>${c.name}</b><br><small>${c.last}</small></div>${c.unread?`<span class="badge">${c.unread}</span>`:''}</div>`).join('');
document.getElementById('myGrid').innerHTML=posts.filter(p=>p.mine).map(p=>`<img src="${p.img}">`).join('')||"<p>Әлі жазба жоқ. + басып жүкте!</p>";
document.getElementById('searchResult').innerHTML=posts.map(p=>`<div class="card"><img src="${p.img}"><div class="card-body"><b>${p.user}</b><p>${p.text}</p></div></div>`).join('');}
function like(i,el){posts[i].liked=!posts[i].liked;posts[i].likes+=posts[i].liked?1:-1;render();}
function comment(i){let c=prompt("Пікір жаз:");if(c)alert("Пікірің жарияланды: "+c+" ✅");}
function share(i){alert("Сілтеме көшірілді! Туыстарыңа жібер ✅");}
function savePost(i){alert("Сақталды 🔖");}
function publish(){let t=document.getElementById('upText').value||"Жаңа жазба";let file=document.getElementById('upFile').files[0];
let url=file?URL.createObjectURL(file):"https://images.unsplash.com/photo-1511895426328-dc8714191300?w=800";
posts.unshift({user:myName,text:t,img:url,likes:0,liked:false,mine:true});document.getElementById('upMsg').innerText="Жарияланды! 🎉 Лентада көр";render();show('home');}
function setSearch(v){document.getElementById('searchInput').value=v;doSearch();}
function doSearch(){let q=document.getElementById('searchInput').value.toLowerCase();let res=posts.filter(p=>p.text.toLowerCase().includes(q));
document.getElementById('searchResult').innerHTML=res.length?res.map(p=>`<div class="card"><img src="${p.img}"><div class="card-body"><b>${p.user}</b><p>${p.text}</p></div></div>`).join(''):"<p>Табылмады. Басқа сөз жаз.</p>";}
function openChat(i){currentChat=i;document.getElementById('chatList').style.display='none';document.getElementById('chatBox').style.display='block';
document.getElementById('chatName').innerText=chats[i].name;chats[i].unread=0;showMsgs();}
function showMsgs(){document.getElementById('msgs').innerHTML=chats[currentChat].msgs.map(m=>`<p style="background:#fff;padding:8px;border-radius:10px">${m}</p>`).join('');}
function sendMsg(){let v=document.getElementById('msgInput').value;if(!v)return;chats[currentChat].msgs.push("Сен: "+v);chats[currentChat].last=v;document.getElementById('msgInput').value="";showMsgs();setTimeout(()=>{chats[currentChat].msgs.push(chats[currentChat].name+": Жарайды, түсіндім 😊");showMsgs();},800);}
function backChats(){document.getElementById('chatList').style.display='block';document.getElementById('chatBox').style.display='none';render();}
function editProfile(){let n=prompt("Жаңа атың:",myName);if(n){myName=n;document.getElementById('myName').innerText=n;document.getElementById('myAvatar').innerText=n[0];alert("Профиль өзгертілді ✅");}}
render();
</script></body></html>
