<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Туыс-Туған</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#FBEFD2;color:#3E2A12}
.hide{display:none!important}
input{width:100%;padding:14px;border:1.5px solid #E8D5A8;border-radius:14px;margin-bottom:10px;font-size:16px;background:#FFFBF0;color:#3E2A12}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:360px;text-align:center}
.logo-circle{width:100px;height:100px;margin:0 auto 8px;background:linear-gradient(135deg,#FFD700,#C98A1B);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;border:4px solid #fff}
.login-card{background:#FFFBF0;border-radius:22px;padding:20px;border:1px solid #F0DFA8}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#FFD700,#C98A1B);color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:bold}
.feed{height:calc(100vh - 68px);overflow-y:scroll;scroll-snap-type:y mandatory;background:#FBEFD2}
.video-card{height:calc(100vh - 68px);width:100%;max-width:430px;margin:0 auto;position:relative;scroll-snap-align:start;background:#000;overflow:hidden}
.video-card video,.video-card img{width:100%;height:100%;object-fit:cover;display:block}
.video-overlay{position:absolute;bottom:0;left:0;right:0;padding:0 78px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.side{position:absolute;right:10px;bottom:118px;display:flex;flex-direction:column;gap:12px;align-items:center}
.side-btn{width:48px;height:48px;border-radius:50%;background:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.side-avatar{width:50px;height:50px;border-radius:50%;border:3px solid #FFD700;object-fit:cover}
.side-count{font-size:11px;margin-top:-8px;font-weight:bold;color:#fff;text-shadow:0 1px 4px #000}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:68px;background:#FFFBF0;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #F0DFA8;border-radius:18px 18px 0 0;z-index:100}
.nav button{background:none;border:none;color:#B8A07A;font-size:14px;font-weight:700;cursor:pointer}
.nav button.on{color:#8B5A00}
.nav-plus{width:52px;height:52px;background:linear-gradient(135deg,#FFD700,#C98A1B)!important;color:#fff!important;border-radius:50%!important;font-size:28px!important;margin-top:-18px}
.profile{background:#FBEFD2;min-height:calc(100vh - 68px);padding-bottom:20px}
.profile-top{background:linear-gradient(180deg,#C98A1B,#F0C060 55%,#FBEFD2);padding:18px 16px 0 16px;color:#fff;border-radius:0 0 24px 24px}
.prof-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid #fff}
.profile-stats{display:flex;gap:8px;background:#FFFBF0;border-radius:18px;padding:12px;margin-top:14px;align-items:center;justify-content:space-between;border:1px solid #F0DFA8;color:#3E2A12}
.stat{text-align:center;cursor:pointer;flex:1}.stat b{font-size:19px;display:block;color:#8B5A00}.stat span{font-size:12px;color:#A67C2E}
.tabs{display:flex;gap:24px;padding:14px 16px 0;border-bottom:1px solid #F0DFA8}
.tab{padding-bottom:9px;cursor:pointer;color:#B8A07A}.tab.active{color:#8B5A00!important;font-weight:800;border-bottom:3px solid #C98A1B}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;padding:0 2px}
.grid3 img,.grid3 video{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#000;cursor:pointer}
.chat-page{background:#FBEFD2;min-height:calc(100vh - 68px);padding:16px}
.chat-item{padding:14px;background:#FFFBF0;border-radius:16px;margin-bottom:8px;border:1px solid #F0DFA8;display:flex;gap:10px;align-items:center;cursor:pointer}
.chat-item img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #FFD700}
.chat-view{position:fixed;inset:0;background:#FBEFD2;z-index:500;display:flex;flex-direction:column;max-width:430px;margin:0 auto}
.chat-header{display:flex;align-items:center;gap:10px;padding:12px;background:#FFFBF0;border-bottom:1px solid #F0DFA8}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:15px}
.msg.mine{align-self:flex-end;background:#C98A1B;color:#fff}
.msg.theirs{align-self:flex-start;background:#FFFBF0;border:1px solid #F0DFA8}
.chat-input-bar{display:flex;gap:8px;padding:10px;background:#FFFBF0;border-top:1px solid #F0DFA8}
.send-btn{width:46px;height:46px;background:#C98A1B;color:#fff;border:none;border-radius:50%;font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.modal video,.modal img{max-width:100%;max-height:60vh;border-radius:12px}
.comment-sheet,.people-sheet{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:55vh;background:#FFFBF0;border-radius:22px 22px 0 0;z-index:1000;display:flex;flex-direction:column;padding:14px}
.people-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #FBEFD2}
.people-row img{width:44px;height:44px;border-radius:50%;border:2px solid #FFD700}
.follow-btn{margin-left:auto;padding:8px 14px;border-radius:20px;border:none;font-weight:700;cursor:pointer}
.follow-btn.follow{background:#C98A1B;color:#fff}.follow-btn.following{background:#FBEFD2;color:#8B5A00;border:1px solid #F0DFA8}
.add-btn{width:100%;padding:14px;background:linear-gradient(135deg,#FFD700,#C98A1B);color:#fff;border:none;border-radius:14px;font-weight:bold;margin:10px 0}
</style>
</head>
<body>

<div class="login-box">

<div class="login-card">
<input id="myName" placeholder="Атыңды жаз">
<input id="myCode" value="TUGAN-2026">

<div id="addPersonBox" class="hide" style="background:#FFFBF0;border:1px solid #F0DFA8;border-radius:16px;padding:12px;margin-bottom:12px">
<input id="newPersonName" placeholder="Аты (мысалы: Апа)">
<input id="newPersonDesc" placeholder="Кім? (мысалы: Апам)">

<div id="pUpload" class="hide"><div style="background:#FBEFD2;min-height:calc(100vh - 68px);padding:20px;text-align:center">

<input id="postText" placeholder="Сипаттама жаз..." style="margin-top:14px;text-align:center">
<label style="display:block;padding:20px;background:#FFFBF0;border:2px dashed #E8D5A8;border-radius:16px;margin:12px 0;cursor:pointer">📷 Сурет / 🎬 Видео таңдау<input type="file" id="postFile" accept="image/*,video/*" style="display:none"></label>
<p id="fileInfo" style="font-size:13px;color:#A67C2E"></p><div id="preview"></div>
<button class="btn" onclick="postJasau()" style="width:200px;border-radius:30px;margin:12px auto;display:block">✦ Жариялау</button>

</div></div>
<div id="p3" class="hide"><div class="profile"><div class="profile-top">

<div><h2 id="profName" style="font-size:28px">Ержан</h2><p style="font-size:14px">ID: tuys_<span id="myId">2026</span></p><p style="font-size:12px">🏕️ Туыс-Туған отбасы</p><input type="file" id="avatarInput" accept="image/*" style="display:none"></div>
</div>
