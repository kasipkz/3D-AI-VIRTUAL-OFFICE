<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Туыстар</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:sans-serif;background:#f2f2f2}
.box{max-width:380px;margin:20px auto;background:#fff;padding:20px;border-radius:20px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-bottom:10px;font-size:16px}
button{width:100%;padding:12px;background:#000;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:bold}
.hide{display:none}
.post{background:#fff;max-width:380px;margin:10px auto;padding:12px;border-radius:16px}
.post img,.post video{width:100%;border-radius:12px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:380px;background:#fff;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #eee}
.nav button{background:none;color:#000;font-size:14px;width:auto}
</style>
</head>
<body>

<div id="loginPage">
  <div class="box" style="margin-top:60px;text-align:center">
    <div style="font-size:50px">👨‍👩‍👧‍👦</div>
    <h2>ТУЫСТАР</h2>
    <input id="myName" placeholder="Атыңды жаз">
    <input id="myCode" value="TUGAN-2026">
    <button onclick="kiru()">КІРУ →</button>
    <p id="errorMsg" style="color:red"></p>
  </div>
</div>

<div id="appPage" class="hide">
  <div style="background:#fff;padding:15px;text-align:center;font-weight:bold">Туыстар 👨‍👩‍👧‍👦 | <span id="showName"></span></div>
  <div class="box">
    <input id="postText" placeholder="Не жаңалық?">
    <!-- МІНЕ ОСЫ ЖЕР - СУРЕТ + ВИДЕО -->
    <input type="file" id="postFile" accept="image/*,video/*">
    <p style="font-size:12px;color:gray">Сурет немесе 15-60 сек видео таңда</p>
    <div id="preview"></div>
    <button onclick="postJasau()" style="margin-top:10px">Жариялау</button>
  </div>
  <div id="feed"></div>
  <div style="height:70px"></div>
  <div class="nav">
    <button onclick="location.reload()">🏠 Лента</button>
    <button onclick="shigu()">👤 Шығу</button>
  </div>
</div>

<script>
var posts = [
  {author:'Апа', text:'Бүгін бауырсақ пісірдім 😋', media:'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600', type:'image'},
  {author:'Аға', text:'Мына видеоны көріңдер 🎬', media:'https://www.w3schools.com/html/mov_bbb.mp4', type:'video'}
];
var myName=''; var tmpMedia=''; var tmpType='image';

function kiru(){
  var name=document.getElementById('myName').value.trim();
  var code=document.getElementById('myCode').value.trim().toUpperCase();
  if(!name){document.getElementById('errorMsg').innerText='Атыңды жаз!';return;}
  if(code!=='TUGAN-2026'){document.getElementById('errorMsg').innerText='Код қате!';return;}
  myName=name;
  document.getElementById('loginPage').classList.add('hide');
  document.getElementById('appPage').classList.remove('hide');
  document.getElementById('showName').innerText=myName;
  render();
}
function render(){
  var h='';
  for(var i=0;i<posts.length;i++){
    var m = posts[i].type==='video' ? '<video src="'+posts[i].media+'" controls></video>' : '<img src="'+posts[i].media+'">';
    h += '<div class="post"><b>'+posts[i].author+'</b><p>'+posts[i].text+'</p>'+m+'</div>';
  }
  document.getElementById('feed').innerHTML=h;
}
document.getElementById('postFile').addEventListener('change', function(e){
  var f=e.target.files[0]; if(!f) return;
  if(f.size > 15*1024*1024){ alert('Видео үлкен екен, 15МБ-тан кіші болсын'); return; }
  var r=new FileReader();
  r.onload=function(ev){
    tmpMedia=ev.target.result;
    tmpType = f.type.indexOf('video')===0 ? 'video' : 'image';
    document.getElementById('preview').innerHTML = tmpType==='video' ? '<video src="'+tmpMedia+'" controls style="width:100%;border-radius:12px"></video>' : '<img src="'+tmpMedia+'" style="width:100%;border-radius:12px">';
  };
  r.readAsDataURL(f);
});
function postJasau(){
  var t=document.getElementById('postText').value;
  if(!t && !tmpMedia){alert('Мәтін немесе файл керек!');return;}
  posts.unshift({author:myName, text:t||'Жаңа видео ❤️', media:tmpMedia||'', type:tmpType});
  tmpMedia=''; document.getElementById('postText').value=''; document.getElementById('preview').innerHTML='';
  render(); alert('Жарияланды ✅');
}
function shigu(){location.reload();}
</script>
</body>
</html>
