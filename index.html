<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Туыстар</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:sans-serif;background:#f2f2f2;padding-bottom:70px}
.box{max-width:420px;margin:12px auto;background:#fff;padding:16px;border-radius:20px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-bottom:10px;font-size:16px}
button{width:100%;padding:12px;background:#000;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:bold}
.hide{display:none}
.post{background:#fff;max-width:420px;margin:10px auto;padding:12px;border-radius:16px}
.post img,.post video{width:100%;border-radius:12px}
.top{max-width:420px;margin:0 auto;background:#fff;padding:14px;text-align:center;font-weight:bold;position:sticky;top:0;z-index:10}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #eee;z-index:99}
.nav button{background:none;color:#555;font-size:13px;width:auto;padding:5px}
.nav button.on{color:#000;font-weight:900}
.chat-item{padding:12px;border-bottom:1px solid #eee;cursor:pointer}
/* ТикТок профилі */
.profile-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.avatar-wrap{position:relative;flex-shrink:0}
.avatar-big{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid #eee;background:#ddd;display:block}
.avatar-edit{position:absolute;bottom:0;right:0;background:#000;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;border:2px solid #fff}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-top:10px}
.grid3 img,.grid3 video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px;background:#000}
.stat{display:flex;gap:14px;font-size:14px;margin-top:6px}
.stat b{font-size:16px}
</style>
</head>
<body>

<!-- КІРУ -->
<div id="loginPage">
  <div class="box" style="margin-top:60px;text-align:center">
    <div style="font-size:50px">👨‍👩‍👧‍👦</div>
    <h2>ТУЫСТАР</h2>
    <input id="myName" placeholder="Атыңды жаз: Ержан">
    <input id="myCode" value="TUGAN-2026">
    <button onclick="kiru()">КІРУ →</button>
    <p id="errorMsg" style="color:red"></p>
  </div>
</div>

<div id="appPage" class="hide">
  <div class="top">Туыстар 👨‍👩‍👧‍👦 | <span id="showName"></span></div>

  <!-- ЛЕНТА -->
  <div id="p1">
    <div class="box">
      <input id="postText" placeholder="Не жаңалық?">
      <input type="file" id="postFile" accept="image/*,video/*">
      <div id="preview"></div>
      <button onclick="postJasau()">Жариялау</button>
    </div>
    <div id="feed"></div>
  </div>

  <!-- ХАТТАР -->
  <div id="p2" class="hide">
    <div class="box"><b>Хаттар 💬</b>
      <div class="chat-item" onclick="chatAsh('Апа')">👤 Апа <span style="float:right">›</span></div>
      <div class="chat-item" onclick="chatAsh('Аға')">👤 Аға <span style="float:right">›</span></div>
      <div class="chat-item" onclick="chatAsh('Әпке')">👤 Әпке <span style="float:right">›</span></div>
    </div>
    <div id="chatBox" class="box hide"><b id="chatName"></b><div id="chatMsgs" style="min-height:80px;margin:10px 0"></div><input id="chatInput" placeholder="Хат жаз..."><button onclick="hatJiberu()">Жіберу</button></div>
  </div>

  <!-- ПРОФИЛЬ - ТИКТОК СТИЛЬ -->
  <div id="p3" class="hide">
    <div class="box">
      <!-- Аватар ОҢ ЖАҚ ШЕТТЕ -->
      <div class="profile-head">
        <div>
          <h2 id="profName" style="margin:0">Ержан</h2>
          <p style="color:gray;margin:4px 0;font-size:14px">@erzhan • Туыс</p>
          <div class="stat"><span><b id="cntPosts">0</b> пост</span><span><b>12</b> туыс</span><span><b>48</b> ❤️</span></div>
          <button onclick="document.getElementById('avatarInput').click()" style="margin-top:10px;padding:8px;font-size:14px;width:auto">✏️ Аватарды өзгерту</button>
          <input type="file" id="avatarInput" accept="image/*" class="hide">
        </div>
        <div class="avatar-wrap" onclick="document.getElementById('avatarInput').click()">
          <img id="myAvatar" src="" class="avatar-big">
          <div class="avatar-edit">+</div>
        </div>
      </div>

      <div style="background:#fff8c5;padding:10px;border-radius:12px;margin-top:12px;text-align:center"><b>Шақыру кодың: TUGAN-2026</b></div>
      <button onclick="shigu()" style="background:#ffe0e0;color:red;margin-top:10px">Шығу</button>
    </div>

    <!-- 3 ҚАТАР ВИДЕО -->
    <div class="box">
      <b>🎬 Видеолар / Суреттер</b>
      <div id="myPosts" class="grid3"></div>
      <p id="noPost" style="color:gray;font-size:14px;text-align:center">Әлі пост жоқ. Лентадан сал!</p>
    </div>
  </div>

  <div class="nav">
    <button id="n1" class="on" onclick="bet(1)">🏠<br>Лента</button>
    <button id="n2" onclick="bet(2)">💬<br>Хаттар</button>
    <button id="n3" onclick="bet(3)">👤<br>Профиль</button>
  </div>
</div>

<script>
var posts = JSON.parse(localStorage.getItem('tuys_posts')||'null') || [
  {author:'Апа',text:'Бүгін бауырсақ 😋',media:'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600',type:'image'},
  {author:'Аға',text:'Видео 🎬',media:'https://www.w3schools.com/html/mov_bbb.mp4',type:'video'}
];
var myName = localStorage.getItem('tuys_name')||'';
var myAvatar = localStorage.getItem('tuys_avatar')||'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
var tmpMedia=''; var tmpType='image';

if(myName){ document.getElementById('loginPage').classList.add('hide'); document.getElementById('appPage').classList.remove('hide'); document.getElementById('showName').innerText=myName; document.getElementById('profName').innerText=myName; document.getElementById('myAvatar').src=myAvatar; render(); }

function save(){ localStorage.setItem('tuys_posts', JSON.stringify(posts)); localStorage.setItem('tuys_name', myName); localStorage.setItem('tuys_avatar', myAvatar); }

function kiru(){
  var n=document.getElementById('myName').value.trim();
  var c=document.getElementById('myCode').value.trim().toUpperCase();
  if(!n){document.getElementById('errorMsg').innerText='Атыңды жаз!';return;}
  if(c!=='TUGAN-2026'){document.getElementById('errorMsg').innerText='Код қате!';return;}
  myName=n; save();
  document.getElementById('loginPage').classList.add('hide');
  document.getElementById('appPage').classList.remove('hide');
  document.getElementById('showName').innerText=myName;
  document.getElementById('profName').innerText=myName;
  document.getElementById('myAvatar').src=myAvatar;
  render();
}
function render(){
  var h='';
  for(var i=0;i<posts.length;i++){
    var m=posts[i].type==='video'?'<video src="'+posts[i].media+'" controls></video>':'<img src="'+posts[i].media+'">';
    var av = posts[i].author===myName ? myAvatar : 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
    h+='<div class="post"><div style="display:flex;align-items:center;gap:8px"><img src="'+av+'" style="width:32px;height:32px;border-radius:50%;object-fit:cover"><b>'+posts[i].author+'</b></div><p>'+posts[i].text+'</p>'+m+'</div>';
  }
  document.getElementById('feed').innerHTML=h;
  var my='';
  var cnt=0;
  for(var j=0;j<posts.length;j++){ if(posts[j].author===myName){ cnt++; my+= posts[j].type==='video'?'<video src="'+posts[j].media+'" muted></video>':'<img src="'+posts[j].media+'">'; } }
  document.getElementById('myPosts').innerHTML=my;
  document.getElementById('cntPosts').innerText=cnt;
  document.getElementById('noPost').style.display = cnt? 'none':'block';
}

// АВАТАРДЫ ӨЗГЕРТУ
document.getElementById('avatarInput').addEventListener('change', function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(ev){ myAvatar=ev.target.result; document.getElementById('myAvatar').src=myAvatar; save(); render(); alert('Аватар өзгерді ✅'); };
  r.readAsDataURL(f);
});

// ПОСТ
document.getElementById('postFile').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(ev){ tmpMedia=ev.target.result; tmpType=f.type.indexOf('video')===0?'video':'image'; document.getElementById('preview').innerHTML=tmpType==='video'?'<video src="'+tmpMedia+'" controls style="width:100%;border-radius:12px"></video>':'<img src="'+tmpMedia+'" style="width:100%;border-radius:12px">'; };
  r.readAsDataURL(f);
});
function postJasau(){
  var t=document.getElementById('postText').value;
  if(!t && !tmpMedia){alert('Мәтін немесе файл керек!');return;}
  posts.unshift({author:myName,text:t||'Жаңа пост ❤️',media:tmpMedia||'https://images.unsplash.com/photo-1511632765486-a01980e01a18?w=600',type:tmpType});
  tmpMedia=''; document.getElementById('postText').value=''; document.getElementById('preview').innerHTML=''; save(); render(); bet(3); alert('Жарияланды ✅ Профильге түсті!');
}
function bet(n){
  document.getElementById('p1').classList.add('hide'); document.getElementById('p2').classList.add('hide'); document.getElementById('p3').classList.add('hide');
  document.getElementById('p'+n).classList.remove('hide');
  document.getElementById('n1').classList.remove('on'); document.getElementById('n2').classList.remove('on'); document.getElementById('n3').classList.remove('on');
  document.getElementById('n'+n).classList.add('on');
}
function chatAsh(name){ document.getElementById('chatBox').classList.remove('hide'); document.getElementById('chatName').innerText=name; document.getElementById('chatMsgs').innerHTML='<div>Сәлем! 👋</div>'; }
function hatJiberu(){ var v=document.getElementById('chatInput').value; if(!v) return; document.getElementById('chatMsgs').innerHTML+='<div style="background:#000;color:#fff;padding:8px;border-radius:10px;margin:5px 0">'+v+'</div>'; document.getElementById('chatInput').value=''; }
function shigu(){ localStorage.clear(); location.reload(); }
</script>
</body>
</html>
